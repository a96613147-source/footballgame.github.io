<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер 2D Футбол: Анимация и Звуки</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin: 5px 0; color: #2ecc71; text-transform: uppercase; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .controls { margin-bottom: 10px; display: flex; gap: 15px; }
        button {
            background: #2ecc71; border: none; color: white; padding: 10px 20px;
            font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #27ae60; }
        button.active { background: #e74c3c; }
        .scoreboard { font-size: 32px; font-weight: bold; margin-bottom: 5px; background: rgba(0,0,0,0.4); padding: 5px 20px; border-radius: 10px; border: 1px solid #333; }
        .instructions { font-size: 13px; color: #bbb; margin-bottom: 10px; text-align: center; max-width: 600px; line-height: 1.4; }
        canvas { background-color: #27ae60; border: 4px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border-radius: 8px; }
    </style>
</head>
<body>

    <h1>🏆 Супер 2D Футбол</h1>
    
    <div class="controls">
        <button id="btnBot" class="active" onclick="setMode('bot')">🤖 Игрок против Бота</button>
        <button id="btnPvP" onclick="setMode('pvp')">👥 Режим 2 Игрока</button>
    </div>

    <div class="instructions" id="instText">
        <b>Синий игрок:</b> W, A, S, D (Движение во все стороны). <br>
        <b>Красный бот:</b> Играет автоматически.
    </div>

    <div class="scoreboard">
        <span id="scoreLeft" style="color: #3498db;">0</span> : <span id="scoreRight" style="color: #e74c3c;">0</span>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let mode = 'bot';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'goal') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
                osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        const playerRadius = 22;
        const ballRadius = 12;

        let player1 = { x: 150, y: canvas.height / 2, score: 0, color: '#3498db', animTime: 0, isMoving: false, dir: 1 };
        let player2 = { x: canvas.width - 150, y: canvas.height / 2, score: 0, color: '#e74c3c', animTime: 0, isMoving: false, dir: -1 };
        let ball = { x: canvas.width / 2, y: canvas.height / 2, dx: 0, dy: 0, speed: 5, friction: 0.985 };

        const goalTop = 170;
        const goalBottom = 330;

        let keys = {};
        window.addEventListener("keydown", (e) => { keys[e.code] = true; if(audioCtx.state === 'suspended') audioCtx.resume(); });
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        function setMode(newMode) {
            mode = newMode;
            document.getElementById("btnBot").classList.toggle("active", mode === 'bot');
            document.getElementById("btnPvP").classList.toggle("active", mode === 'pvp');
            
            if (mode === 'bot') {
                document.getElementById("instText").innerHTML = "<b>Синий игрок:</b> W, A, S, D (Движение во все стороны). <br><b>Красный бот:</b> Управляется искусственным интеллектом.";
            } else {
                document.getElementById("instText").innerHTML = "<b>Синий игрок (1):</b> W, A, S, D | <b>Красный игрок (2):</b> Стрелочки клавиатуры";
            }
            resetGame();
        }

        function resetBall(scoringPlayer) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = scoringPlayer === 1 ? -3 : 3;
            ball.dy = (Math.random() - 0.5) * 4;
            
            player1.x = 150; player1.y = canvas.height / 2;
            player2.x = canvas.width - 150; player2.y = canvas.height / 2;
        }

        function resetGame() {
            player1.score = 0; player2.score = 0;
            document.getElementById("scoreLeft").innerText = 0;
            document.getElementById("scoreRight").innerText = 0;
            resetBall(1);
        }

        function clampPlayer(p) {
            if (p.x < playerRadius) p.x = playerRadius;
            if (p.x > canvas.width - playerRadius) p.x = canvas.width - playerRadius;
            if (p.y < playerRadius) p.y = playerRadius;
            if (p.y > canvas.height - playerRadius) p.y = canvas.height - playerRadius;
        }

        function update() {
            player1.isMoving = false;
            if (keys["KeyW"]) { player1.y -= 4.5; player1.isMoving = true; }
            if (keys["KeyS"]) { player1.y += 4.5; player1.isMoving = true; }
            if (keys["KeyA"]) { player1.x -= 4.5; player1.isMoving = true; player1.dir = -1; }
            if (keys["KeyD"]) { player1.x += 4.5; player1.isMoving = true; player1.dir = 1; }
            clampPlayer(player1);
            if (player1.isMoving) player1.animTime += 0.2;

            player2.isMoving = false;
            if (mode === 'pvp') {
                if (keys["ArrowUp"]) { player2.y -= 4.5; player2.isMoving = true; }
                if (keys["ArrowDown"]) { player2.y += 4.5; player2.isMoving = true; }
                if (keys["ArrowLeft"]) { player2.x -= 4.5; player2.isMoving = true; player2.dir = -1; }
                if (keys["ArrowRight"]) { player2.x += 4.5; player2.isMoving = true; player2.dir = 1; }
            } else {
                let targetX = ball.x > canvas.width / 2 ? ball.x - 30 : canvas.width - 120;
                let targetY = ball.y;
                
                if (Math.abs(player2.x - targetX) > 5) {
                    player2.x += (targetX > player2.x ? 3.5 : -3.5);
                    player2.isMoving = true;
                    player2.dir = targetX > player2.x ? 1 : -1;
                }
                if (Math.abs(player2.y - targetY) > 5) {
                    player2.y += (targetY > player2.y ? 3.5 : -3.5);
                    player2.isMoving = true;
                }
            }
            clampPlayer(player2);
            if (player2.isMoving) player2.animTime += 0.2;

            ball.dx *= ball.friction;
            ball.dy *= ball.friction;
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ballRadius < 0) { ball.y = ballRadius; ball.dy *= -1; playSound('hit'); }
            if (ball.y + ballRadius > canvas.height) { ball.y = canvas.height - ballRadius; ball.dy *= -1; playSound('hit'); }

            if (ball.x - ballRadius < 0) {
                if (ball.y > goalTop && ball.y < goalBottom) {
                    player2.score++;
                    document.getElementById("scoreRight").innerText = player2.score;
                    playSound('goal');
                    resetBall(2);
                } else {
                    ball.x = ballRadius; ball.dx *= -1; playSound('hit');
                }
            }
            if (ball.x + ballRadius > canvas.width) {
                if (ball.y > goalTop && ball.y < goalBottom) {
                    player1.score++;
                    document.getElementById("scoreLeft").innerText = player1.score;
                    playSound('goal');
                    resetBall(1);
                } else {
                    ball.x = canvas.width - ballRadius; ball.dx *= -1; playSound('hit');
                }
            }

            checkBallCollision(player1);
            checkBallCollision(player2);
        }

        function checkBallCollision(p) {
            let distX = ball.x - p.x;
            let distY = ball.y - p.y;
            let distance = Math.sqrt(distX * distX + distY * distY);

            if (distance < playerRadius + ballRadius) {
                let angle = Math.atan2(distY, distX);
                
                ball.x = p.x + Math.cos(angle) * (playerRadius + ballRadius);
                ball.y = p.y + Math.sin(angle) * (playerRadius + ballRadius);

                ball.dx = Math.cos(angle) * ball.speed * 1.5;
                ball.dy = Math.sin(angle) * ball.speed * 1.5;
                
                playSound('hit');
            }
        }

        function drawPlayer(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            let legSwing = p.isMoving ? Math.sin(p.animTime) * 12 : 0;
            
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(-8 * p.dir, 15 + legSwing, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(8 * p.dir, 15 - legSwing, 5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(0, 0, playerRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(8 * p.dir, -5, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(10 * p.dir, -5, 2.5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(p.color === '#3498db' ? "10" : "7", -4 * p.dir, 4);

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#27ae60"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2); ctx.stroke();
            
            ctx.strokeRect(0, 100, 120, 300);
            ctx.strokeRect(canvas.width - 120, 100, 120, 300);

            ctx.fillStyle = "rgba(255,255,255,0.3)";
            ctx.fillRect(0, goalTop, 15, goalBottom - goalTop);
            ctx.fillRect(canvas.width - 15, goalTop, 15, goalBottom - goalTop);
            
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(0, goalTop); ctx.lineTo(15, goalTop); ctx.lineTo(15, goalBottom); ctx.lineTo(0, goalBottom); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(canvas.width, goalTop); ctx.lineTo(canvas.width - 15, goalTop); ctx.lineTo(canvas.width - 15, goalBottom); ctx.lineTo(canvas.width, goalBottom); ctx.stroke();

            drawPlayer(player1);
            drawPlayer(player2);

            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, ballRadius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = "#111";
            for(let i=0; i<5; i++) {
                ctx.beginPath(); ctx.arc(Math.cos(i)*6, Math.sin(i)*6, 2.5, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        resetBall(1);
        gameLoop();
    </script>
</body>
</html>
